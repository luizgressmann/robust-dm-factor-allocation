name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check --exclude notebooks .
      - name: Test
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage report
        run: coverage report --fail-under=85
      - name: Check committed notebook state
        run: python scripts/check_notebook_outputs.py
      - name: Run synthetic demo
        run: python -m robust_dm_factor_allocation.demo --output-dir build/demo
