[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-dm-factor-allocation"
version = "1.0.0"
description = "Walk-forward portfolio allocation across developed-market equity factors"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Luiz Gressmann" }]
dependencies = [
    "matplotlib>=3.7,<4",
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "PyYAML>=6.0,<7",
]

[project.urls]
Repository = "https://github.com/luizgressmann/robust-dm-factor-allocation"

[project.optional-dependencies]
research = [
    "jupyterlab>=4.0,<5",
    "xlrd>=2.0.1,<3",
]
dev = [
    "coverage[toml]>=7.6,<8",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robust_dm_factor_allocation = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.coverage.run]
branch = true
source = ["robust_dm_factor_allocation"]

[tool.coverage.report]
show_missing = true
skip_covered = true
